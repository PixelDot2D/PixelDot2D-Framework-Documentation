name: Build Documentation PDF

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Pandoc and WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Combine Markdown and Build PDF
        run: |
          python3 -c '
          import glob, os, re

          ordered_sections = [
              "Designer/Core/Summary.md",
              "Designer/Core/*.md",
              "Designer/Combat/Summary.md",
              "Designer/Combat/*.md",
              "Designer/ModularCharacter/Summary.md",
              "Designer/ModularCharacter/*.md",
              "Designer/Items/Summary.md",
              "Designer/Items/*.md",
              "Designer/Shared/Summary.md",
              "Designer/Shared/*.md",
              "Programmer/Core/Summary.md",
              "Programmer/Core/*.md",
              "Programmer/Combat/Summary.md",
              "Programmer/Combat/*.md",
              "Programmer/ModularCharacter/Summary.md",
              "Programmer/ModularCharacter/*.md",
              "Programmer/Items/Summary.md",
              "Programmer/Items/*.md",
              "Programmer/Shared/Summary.md",
              "Programmer/Shared/*.md",
          ]

          seen = set()
          files = []
          for pattern in ordered_sections:
              for path in sorted(glob.glob(pattern)):
                  if path not in seen and os.path.isfile(path):
                      seen.add(path)
                      files.append(path)

          with open("combined.md", "w", encoding="utf-8") as out:
              for idx, f in enumerate(files):
                  if idx > 0:
                      out.write("\n\n")
                  with open(f, "r", encoding="utf-8") as inp:
                      text = inp.read()
                      text = re.sub(r"\[([^\]]+)\]\([^)]+\.md\)", r"**\1**", text)
                      out.write(text)
          '
          cat << 'EOF' > pdf-style.css
          @page { margin: 0.65in; }
          body { font-family: sans-serif; font-size: 10pt; line-height: 1.45; color: #1f2328; }
          h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 4px; break-before: page; }
          h1:first-of-type { break-before: auto; }
          pre { background: #f6f8fa; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; word-wrap: break-word; font-size: 8.5pt; }
          code { font-family: monospace; background: #f6f8fa; padding: 2px 4px; border-radius: 4px; }
          img { max-width: 100%; height: auto; }
          #TOC ul { list-style-type: none; padding-left: 16px; }
          #TOC > ul { padding-left: 0; }
          #TOC a { text-decoration: none; color: #0969da; }
          EOF
          pandoc combined.md -f gfm -o PixelDot2D_Documentation.pdf --pdf-engine=weasyprint --css=pdf-style.css --toc --toc-depth=2 --metadata title="PixelDot2D Framework Documentation"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PixelDot2D_Documentation.pdf
          path: PixelDot2D_Documentation.pdf
          archive: false
